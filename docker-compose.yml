services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      # 覆盖本地相对路径，写入持久化卷
      DATABASE_URL: sqlite:////data/math_graph_ai.db
    volumes:
      - mathgraph-data:/data
    ports:
      - "${MATHGRAPH_BACKEND_PORT:-6108}:8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${MATHGRAPH_PORT:-6106}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mathgraph-data:
