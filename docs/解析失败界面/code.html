<style>
        .typing-indicator span {
            animation: blink 1.4s infinite both;
            height: 6px;
            width: 6px;
            border-radius: 50%;
            background-color: #737686;
            display: inline-block;
            margin: 0 2px;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes blink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }
        .loader {
            border: 3px solid #e1e2ed;
            border-top: 3px solid #004ac6;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="h-full bg-background text-on-background font-body-md text-body-md overflow-hidden flex flex-col">
<!-- TopNavBar -->
<header class="bg-surface text-primary font-body-md text-body-md docked full-width top-0 border-b border-outline-variant transition-colors duration-200 flex justify-between items-center w-full px-gutter h-16 shrink-0 z-50 relative shadow-sm">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-surface-variant cursor-pointer md:hidden" data-icon="menu">menu</span>
<div class="font-headline-md text-headline-md font-bold text-primary">MathGraph AI</div>
</div>
<div class="hidden">search</div>
<div class="flex items-center gap-4">
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="share">share</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="export">csv</span>
</button>
<button class="text-on-surface-variant hover:bg-surface-container transition-colors duration-200 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>

</div>

<div class="mb-6 px-2 mt-16 md:mt-0">
<button class="w-full bg-primary text-on-primary rounded-xl py-3 px-4 font-label-sm text-label-sm font-semibold flex items-center justify-center gap-2 hover:bg-on-primary-fixed-variant transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="add" data-weight="fill">add</span>
                    + New Plot
                </button>
</div>
<div class="flex-1 overflow-y-auto pr-2 space-y-1">
<a class="bg-primary-container text-on-primary-container rounded-xl flex items-center gap-3 px-3 py-2 transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="history">history</span>
<span class="">Today</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container-highest rounded-xl flex items-center gap-3 px-3 py-2 transition-colors duration-200" href="#">
<span class="material-symbols-outlined" data-icon="event_repeat">event_repeat</span>
<span class="">Yesterday</span>
</a>
<a class="text-on-surface-variant hover:bg-surface-container-highest rounded-xl flex items-center gap-3 px-3 py-2 transition-colors duration-200" href="#">

</a>

<!-- Main Content Area (Chat & Graph) -->
<main class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
<!-- Chat Column -->
<section class="flex-1 flex flex-col min-w-0 bg-background border-r border-outline-variant z-10">

<div class="self-end max-w-[80%]">
<div class="bg-primary/5 text-on-background px-4 py-3 rounded-xl rounded-tr-sm border border-primary/10 shadow-sm">
<p class="font-body-md text-body-md">画一个 y = 1/0</p>
</div>
</div>
<!-- AI Typing Indicator -->

<div class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-sm" data-icon="smart_toy">smart_toy</span>
</div>
<div class="bg-surface-container-lowest text-on-surface px-4 py-3 rounded-xl rounded-tl-sm border border-outline-variant shadow-sm flex items-center h-[48px]">
<div class="typing-indicator flex items-center">
<span></span>
<span></span>
<span></span>
</div>
</div>
</div>
</div>
<!-- Input Area -->

</div>
</div>

<div class="absolute inset-0" style="background-image: linear-gradient(to right, #c3c6d7 1px, transparent 1px), linear-gradient(to bottom, #c3c6d7 1px, transparent 1px); background-size: 100px 100px; opacity: 0.8;"></div>
<!-- X/Y Axes -->
<div class="absolute top-1/2 left-0 w-full h-[2px] bg-outline-variant -translate-y-1/2 bg-outline"></div>
<div class="absolute left-1/2 top-0 h-full w-[2px] bg-outline-variant -translate-x-1/2 bg-outline"></div><!-- X-axis labels -->

    <span class="text-[10px] text-on-surface-variant/60 font-math-code">-5</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code translate-x-4">0</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">5</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">10</span>
</div>
<!-- Y-axis labels -->
<div class="absolute left-1/2 top-0 h-full flex flex-col justify-between py-4 -translate-x-1/2 pointer-events-none">
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">10</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">5</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code -translate-y-4">0</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">-5</span>
    <span class="text-[10px] text-on-surface-variant/60 font-math-code">-10</span>
</div>
<!-- Loading Spinner Overlay -->
<div class="absolute inset-0 bg-white/50 backdrop-blur-[2px] flex flex-col items-center justify-center z-10">
<div class="loader mb-4"></div>
<span class="font-label-sm text-label-sm text-on-surface-variant">Processing Equation...</span>
</div>
<!-- Floating Controls -->
<div class="absolute top-4 right-4 flex gap-2 z-20">
<button class="w-8 h-8 bg-surface-container-lowest border border-outline-variant rounded-md flex items-center justify-center text-on-surface-variant hover:bg-surface-container shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="add">add</span>
</button>

</button>
<button class="w-8 h-8 bg-surface-container-lowest border border-outline-variant rounded-md flex items-center justify-center text-on-surface-variant hover:bg-surface-container shadow-sm">
<span class="material-symbols-outlined text-sm" data-icon="center_focus_strong">center_focus_strong</span>
</button>
</div>
</div>

<div class="h-auto min-h-[64px] border-t border-outline-variant bg-surface-container-lowest p-4 overflow-y-auto shrink-0 z-20 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex flex-col gap-2">
<!-- Error Item -->
<div class="flex items-center gap-3 bg-error-container/30 px-3 py-2 rounded-lg border border-error/20">
<div class="w-3 h-3 rounded-full bg-error shrink-0"></div>
<div class="flex-1 font-math-code text-math-code text-error opacity-70">y = 1/0</div>
<div class="flex items-center gap-2 text-error font-label-sm text-label-sm bg-error-container px-2 py-1 rounded">
<span class="material-symbols-outlined text-[14px]" data-icon="error">error</span>
                                方程解析失败: 请检查语法
                            </div>
</div>
</div>
</div>

</div>
