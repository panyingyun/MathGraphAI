  <rect x="1362" y="798" width="158" height="68" rx="14" fill="#f5faf8" stroke="#c2dfd7"/>
  <text x="1441" y="826" text-anchor="middle" class="tech">DATA MODEL</text><text x="1441" y="851" text-anchor="middle" class="node-sub">sessions · messages</text>

