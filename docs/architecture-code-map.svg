<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="title desc">
  <title id="title">MathGraph AI 业务架构图</title>
  <desc id="desc">展示从用户交互、SSE 请求、统一有界 ReAct Agent、确定性数学工具、Final Gate 到事务持久化、可观测性和发布门禁的完整业务闭环。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7faff"/><stop offset="1" stop-color="#eef5ff"/></linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1768e5"/><stop offset="1" stop-color="#00a4cf"/></linearGradient>
    <linearGradient id="agent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6847dc"/><stop offset="1" stop-color="#9b57e9"/></linearGradient>
    <linearGradient id="good" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#03866d"/><stop offset="1" stop-color="#13aa83"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#79a5dc" stroke-opacity=".09"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#194a87" flood-opacity=".10"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#194a87" flood-opacity=".08"/></filter>
    <marker id="blueArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#2874d8"/></marker>
    <marker id="purpleArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#7656dc"/></marker>
    <marker id="greenArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#089679"/></marker>
    <style>
      text { font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif; fill:#18243a; }
      .title { font-size:34px; font-weight:760; letter-spacing:-.02em; }
      .subtitle { font-size:14px; fill:#637994; }
      .lane { font-size:20px; font-weight:740; }
      .lane-en { font-size:11px; font-weight:700; letter-spacing:.13em; fill:#6d819a; }
      .node { font-size:16px; font-weight:730; }
      .body { font-size:12px; fill:#5f7590; }
      .small { font-size:11px; fill:#71859d; }
      .caps { font-size:11px; font-weight:750; letter-spacing:.09em; fill:#38689f; }
      .white { fill:#fff; }
      .flow { fill:none; stroke:#2874d8; stroke-width:2.4; marker-end:url(#blueArrow); }
      .flow-ai { fill:none; stroke:#7656dc; stroke-width:2.4; marker-end:url(#purpleArrow); }
      .flow-data { fill:none; stroke:#089679; stroke-width:2.4; marker-end:url(#greenArrow); }
      .return { fill:none; stroke:#5f7fa8; stroke-width:2; stroke-dasharray:7 6; marker-end:url(#blueArrow); }
    </style>
  </defs>

  <rect width="1800" height="1240" fill="url(#bg)"/><rect width="1800" height="1240" fill="url(#grid)"/>
  <circle cx="1680" cy="50" r="260" fill="#cce9ff" opacity=".25"/><circle cx="30" cy="1180" r="280" fill="#ded8ff" opacity=".20"/>

  <!-- header -->
  <g transform="translate(60 38)">
    <rect width="56" height="56" rx="17" fill="url(#brand)" filter="url(#soft)"/>
    <path d="M12 40c8-21 15-24 21-6 4 12 9 3 13-9M13 37c10-7 20-4 31-13" fill="none" stroke="#fff" stroke-width="3.3" stroke-linecap="round"/>
    <path d="m42 9 1.5 5.2 5.2 1.5-5.2 1.5-1.5 5.2-1.5-5.2-5.2-1.5 5.2-1.5z" fill="#fff"/>
    <text x="76" y="25" class="title">MathGraph AI 业务架构图</text>
    <text x="76" y="50" class="subtitle">自然语言数学任务从交互、决策、执行、验证到持久化与质量发布的完整闭环</text>
  </g>
  <g transform="translate(1345 51)">
    <rect width="122" height="30" rx="15" fill="#e8f2ff" stroke="#bdd6f7"/><circle cx="17" cy="15" r="5" fill="#2874d8"/><text x="30" y="19" class="small">用户与传输</text>
    <rect x="132" width="122" height="30" rx="15" fill="#f0eaff" stroke="#d7c8f6"/><circle cx="149" cy="15" r="5" fill="#7656dc"/><text x="162" y="19" class="small">Agent 决策</text>
    <rect x="264" width="122" height="30" rx="15" fill="#e5f7f1" stroke="#b9e1d5"/><circle cx="281" cy="15" r="5" fill="#089679"/><text x="294" y="19" class="small">状态与质量</text>
  </g>

  <!-- stage strip -->
  <g filter="url(#soft)"><rect x="60" y="118" width="1680" height="88" rx="19" fill="#fff" fill-opacity=".92" stroke="#c8d9ee"/></g>
  <text x="84" y="146" class="caps">PRIMARY BUSINESS PATH</text><text x="84" y="177" class="node">主业务链路</text>
  <g transform="translate(235 138)">
    <circle cx="23" cy="23" r="20" fill="#2874d8"/><text x="23" y="29" text-anchor="middle" class="node white">1</text><text x="53" y="20" class="node">理解</text><text x="53" y="41" class="body">RequestSpec</text>
    <path d="M155 23h62" class="flow"/><circle cx="242" cy="23" r="20" fill="#4869d9"/><text x="242" y="29" text-anchor="middle" class="node white">2</text><text x="272" y="20" class="node">决策</text><text x="272" y="41" class="body">DeepSeek / Local</text>
    <path d="M400 23h62" class="flow-ai"/><circle cx="487" cy="23" r="20" fill="#7656dc"/><text x="487" y="29" text-anchor="middle" class="node white">3</text><text x="517" y="20" class="node">执行 / 计算</text><text x="517" y="41" class="body">Strict Tools</text>
    <path d="M690 23h62" class="flow-ai"/><circle cx="777" cy="23" r="20" fill="#8958df"/><text x="777" y="29" text-anchor="middle" class="node white">4</text><text x="807" y="20" class="node">验证</text><text x="807" y="41" class="body">Final Gate</text>
    <path d="M930 23h62" class="flow-data"/><circle cx="1017" cy="23" r="20" fill="#089679"/><text x="1017" y="29" text-anchor="middle" class="node white">5</text><text x="1047" y="20" class="node">保存</text><text x="1047" y="41" class="body">Commit / Preserve</text>
    <path d="M1197 23h62" class="flow-data"/><circle cx="1284" cy="23" r="20" fill="#0aa783"/><text x="1284" y="29" text-anchor="middle" class="node white">6</text><text x="1314" y="20" class="node">反馈</text><text x="1314" y="41" class="body">Metrics / Gate</text>
  </g>

  <!-- lane panels -->
  <g filter="url(#shadow)">
    <rect x="60" y="238" width="350" height="846" rx="24" fill="#fff" fill-opacity=".94" stroke="#bed4ef"/>
    <rect x="438" y="238" width="350" height="846" rx="24" fill="#fff" fill-opacity=".94" stroke="#bed4ef"/>
    <rect x="816" y="238" width="594" height="846" rx="24" fill="#fff" fill-opacity=".94" stroke="#d1c5ed"/>
    <rect x="1438" y="238" width="302" height="846" rx="24" fill="#fff" fill-opacity=".94" stroke="#bce0d6"/>
  </g>
  <rect x="60" y="238" width="350" height="67" rx="24" fill="#e9f2ff"/><rect x="60" y="281" width="350" height="24" fill="#e9f2ff"/>
  <rect x="438" y="238" width="350" height="67" rx="24" fill="#e6f6ff"/><rect x="438" y="281" width="350" height="24" fill="#e6f6ff"/>
  <rect x="816" y="238" width="594" height="67" rx="24" fill="#f0ebff"/><rect x="816" y="281" width="594" height="24" fill="#f0ebff"/>
  <rect x="1438" y="238" width="302" height="67" rx="24" fill="#e5f7f1"/><rect x="1438" y="281" width="302" height="24" fill="#e5f7f1"/>
  <circle cx="91" cy="271" r="13" fill="#2874d8"/><text x="114" y="269" class="lane">用户工作台</text><text x="114" y="289" class="lane-en">EXPERIENCE</text>
  <circle cx="469" cy="271" r="13" fill="#00a4cf"/><text x="492" y="269" class="lane">请求与流传输</text><text x="492" y="289" class="lane-en">CONTRACT &amp; STREAM</text>
  <circle cx="847" cy="271" r="13" fill="#7656dc"/><text x="870" y="269" class="lane">统一 Agent 业务内核</text><text x="870" y="289" class="lane-en">BOUNDED REACT ORCHESTRATION</text>
  <circle cx="1469" cy="271" r="13" fill="#089679"/><text x="1492" y="269" class="lane">数据与质量</text><text x="1492" y="289" class="lane-en">DATA &amp; QUALITY</text>

  <!-- experience -->
  <g filter="url(#soft)">
    <rect x="85" y="334" width="300" height="116" rx="16" fill="#f4f8ff" stroke="#bfd5ef"/>
    <rect x="85" y="474" width="300" height="150" rx="16" fill="#f8fbff" stroke="#c9d9ed"/>
    <rect x="85" y="648" width="300" height="142" rx="16" fill="#f4f8ff" stroke="#bfd5ef"/>
    <rect x="85" y="814" width="300" height="118" rx="16" fill="#f8fbff" stroke="#c9d9ed"/>
    <rect x="85" y="956" width="300" height="95" rx="16" fill="#edf4ff" stroke="#b7cfea"/>
  </g>
  <text x="108" y="365" class="caps">NATURAL LANGUAGE</text><text x="108" y="394" class="node">描述绘图与数学分析目标</text><text x="108" y="419" class="body">绘制 · 添加 · 修改 · 删除 · 比较 · 求零点</text><text x="108" y="440" class="body">复合任务与多轮指代使用同一入口</text>
  <text x="108" y="505" class="caps">THREE-PANE WORKBENCH</text><text x="108" y="534" class="node">会话 / 对话 / 图像协同</text><text x="108" y="559" class="body">会话历史与分页 · 消息状态</text><text x="108" y="581" class="body">Plotly 图像 · 方程列表 · 视口设置</text><text x="108" y="603" class="body">分析结果 · 标记点 · KaTeX 公式</text>
  <text x="108" y="679" class="caps">LIVE PROGRESS</text><text x="108" y="708" class="node">阶段与步骤实时反馈</text><text x="108" y="733" class="body">理解 → 执行/计算 → 验证 → 保存</text><text x="108" y="755" class="body">显示工具摘要、耗时、模型与回退状态</text><text x="108" y="777" class="body">用户可主动取消当前请求</text>
  <text x="108" y="845" class="caps">DIRECT GRAPH EDIT</text><text x="108" y="874" class="node">确定性图像命令</text><text x="108" y="899" class="body">方程、可见性、样式与视口直接修改</text><text x="108" y="921" class="body">与自然语言共用 GraphState / revision</text>
  <text x="108" y="987" class="caps">CLIENT SAFETY</text><text x="108" y="1016" class="node">math.js AST 白名单采样</text><text x="108" y="1039" class="body">禁用 eval · 处理断点 / NaN / Infinity</text>

  <!-- transport -->
  <g filter="url(#soft)">
    <rect x="463" y="334" width="300" height="142" rx="16" fill="#f0faff" stroke="#b9ddec"/>
    <rect x="463" y="500" width="300" height="158" rx="16" fill="#f7fbff" stroke="#c8d9ed"/>
    <rect x="463" y="682" width="300" height="150" rx="16" fill="#f0faff" stroke="#b9ddec"/>
    <rect x="463" y="856" width="300" height="195" rx="16" fill="#f7fbff" stroke="#c8d9ed"/>
  </g>
  <text x="486" y="365" class="caps">CHAT CONTRACT</text><text x="486" y="394" class="node">POST /api/chat</text><text x="486" y="419" class="body">requestId：幂等与结果缓存</text><text x="486" y="441" class="body">expectedRevision：并发写冲突保护</text><text x="486" y="463" class="body">stream=true：默认开启流式响应</text>
  <text x="486" y="531" class="caps">SERVER-SENT EVENTS</text><text x="486" y="560" class="node">meta / phase / step / done / error</text><text x="486" y="585" class="body">单向增量推送，无需改变最终响应契约</text><text x="486" y="607" class="body">断连 / 异常会收口运行记录</text><text x="486" y="629" class="body">非流模式仍返回同一 ChatResponse</text>
  <text x="486" y="713" class="caps">REQUEST LIFECYCLE</text><text x="486" y="742" class="node">预写入与取消控制</text><text x="486" y="767" class="body">校验会话 → 保存用户消息</text><text x="486" y="789" class="body">创建 agent_run(running) → 启动 Runner</text><text x="486" y="811" class="body">POST /api/chat/cancel 发送取消信号</text>
  <text x="486" y="887" class="caps">SESSION API</text><text x="486" y="916" class="node">会话管理与直接命令</text><text x="486" y="941" class="body">/api/sessions：CRUD、收藏、标题</text><text x="486" y="963" class="body">消息游标分页、上下文摘要</text><text x="486" y="985" class="body">/commands：确定性 GraphState 修改</text><text x="486" y="1028" class="body">统一 Pydantic camelCase 契约</text>

  <!-- agent core -->
  <g filter="url(#soft)">
    <rect x="842" y="334" width="542" height="102" rx="16" fill="#f7f3ff" stroke="#d4c8ef"/>
    <rect x="842" y="460" width="264" height="142" rx="16" fill="#f5f0ff" stroke="#d4c8ef"/>
    <rect x="1120" y="460" width="264" height="142" rx="16" fill="#f2f7ff" stroke="#c2d5ed"/>
    <rect x="842" y="626" width="542" height="182" rx="16" fill="#fbf8ff" stroke="#d6caea"/>
    <rect x="842" y="832" width="264" height="142" rx="16" fill="#f6f2ff" stroke="#d4c8ef"/>
    <rect x="1120" y="832" width="264" height="142" rx="16" fill="#eff9f6" stroke="#bddfd5"/>
    <rect x="842" y="994" width="542" height="57" rx="15" fill="#eaf8f3" stroke="#b8dbd0"/>
  </g>
  <text x="866" y="365" class="caps">UNDERSTAND</text><text x="866" y="394" class="node">RequestSpec / GoalSpec + 上下文构建</text><text x="866" y="419" class="body">提取显式表达式、目标效果、观察要求、目标对象与视口；组合 GraphState、近期消息和上下文摘要</text>
  <text x="866" y="491" class="caps">DECISION PROVIDERS</text><text x="866" y="520" class="node">DeepSeek 优先 · Local 回退</text><text x="866" y="545" class="body">JSON / native tool_calls 双协议</text><text x="866" y="567" class="body">动态工具集、上下文预算与调用上限</text><text x="866" y="589" class="body">可恢复模型错误触发本地计划器</text>
  <text x="1144" y="491" class="caps">EXECUTION MODES</text><text x="1144" y="520" class="node">react / shadow / off</text><text x="1144" y="545" class="body">react：验证成功后提交</text><text x="1144" y="567" class="body">shadow：执行并比较，不改变图状态</text><text x="1144" y="589" class="body">off：单步工具 + 同一 Final Gate</text>
  <text x="866" y="657" class="caps">BOUNDED ACTION LOOP</text><text x="866" y="686" class="node">Action → Command → Tool → Observation → Decision</text>
  <rect x="866" y="706" width="151" height="69" rx="11" fill="#eee8ff" stroke="#d2c3ef"/><text x="942" y="732" text-anchor="middle" class="node">图状态变更</text><text x="942" y="755" text-anchor="middle" class="small">plot / add / update / remove</text>
  <rect x="1032" y="706" width="151" height="69" rx="11" fill="#edf5ff" stroke="#c3d7ed"/><text x="1108" y="732" text-anchor="middle" class="node">数学分析</text><text x="1108" y="755" text-anchor="middle" class="small">交点 / 零点 / 极值 / 比较</text>
  <rect x="1198" y="706" width="162" height="69" rx="11" fill="#edf8f5" stroke="#bfddd4"/><text x="1279" y="732" text-anchor="middle" class="node">视口与标记</text><text x="1279" y="755" text-anchor="middle" class="small">set / fit / markers / sample</text>
  <text x="866" y="797" class="body">严格参数 Schema · 策略与前后置条件 · 工作副本隔离 · 工具超时 · 重复动作检测 · Observation 修复</text>
  <text x="866" y="863" class="caps">FINAL GATE</text><text x="866" y="892" class="node">目标效果与事实观察双重校验</text><text x="866" y="917" class="body">缺失目标继续规划；零动作假成功被拒绝</text><text x="866" y="939" class="body">最终答复只引用已执行工具的事实观察</text><text x="866" y="961" class="body">错误 / 取消均保持原始 GraphState</text>
  <text x="1144" y="863" class="caps">COMMIT POLICY</text><text x="1144" y="892" class="node">事务化保存或显式保留</text><text x="1144" y="917" class="body">success + dirty + react/off → commit</text><text x="1144" y="939" class="body">shadow → baseline diff，不提交</text><text x="1144" y="961" class="body">失败 / 超时 / 取消 → preserve</text>
  <text x="866" y="1029" class="node">所有路径最终落到 save 阶段，并生成一致的 ChatResponse</text>

  <!-- data / quality -->
  <g filter="url(#soft)">
    <rect x="1463" y="334" width="252" height="172" rx="16" fill="#eff9f6" stroke="#b9ded4"/>
    <rect x="1463" y="530" width="252" height="160" rx="16" fill="#f5fbf8" stroke="#c4e0d8"/>
    <rect x="1463" y="714" width="252" height="142" rx="16" fill="#eff9f6" stroke="#b9ded4"/>
    <rect x="1463" y="880" width="252" height="171" rx="16" fill="#f5fbf8" stroke="#c4e0d8"/>
  </g>
  <text x="1486" y="365" class="caps">SESSION STATE</text><text x="1486" y="394" class="node">SQLite + SQLAlchemy</text><text x="1486" y="419" class="body">sessions / messages</text><text x="1486" y="441" class="body">GraphState + revision</text><text x="1486" y="463" class="body">context_summary + message pages</text><text x="1486" y="485" class="body">助手消息与图状态原子保存</text>
  <text x="1486" y="561" class="caps">OBSERVABILITY</text><text x="1486" y="590" class="node">agent_runs / agent_steps</text><text x="1486" y="615" class="body">模式 · Provider · 状态 · 回退 · 耗时</text><text x="1486" y="637" class="body">工具、参数摘要、观察摘要、步骤耗时</text><text x="1486" y="659" class="body">完成 / 错误 / 取消 / 断连均收口</text>
  <text x="1486" y="745" class="caps">METRICS</text><text x="1486" y="774" class="node">近窗口聚合</text><text x="1486" y="799" class="body">成功率 · 回退率 · 延迟分位数</text><text x="1486" y="821" class="body">错误分布 · 工具耗时 · 模式分组</text><text x="1486" y="843" class="body">JSON / Markdown 基线产物</text>
  <text x="1486" y="911" class="caps">RELEASE GATE</text><text x="1486" y="940" class="node">91 用例 × 稳定性重复</text><text x="1486" y="965" class="body">单步 / 复合 / 多轮 / 安全拒绝</text><text x="1486" y="987" class="body">一致性 · 正常终止 · Schema 错误</text><text x="1486" y="1009" class="body">DeepSeek 全量目录 + repeats ≥ 3</text><text x="1486" y="1031" class="body">指标全部达标才允许发布 react</text>

