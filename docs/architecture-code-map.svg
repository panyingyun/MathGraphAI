  <!-- footer -->
  <g filter="url(#soft)"><rect x="60" y="1114" width="1680" height="80" rx="18" fill="#fff" fill-opacity=".92" stroke="#c8d9ee"/></g>
  <text x="86" y="1143" class="caps">BUSINESS GUARANTEE</text><text x="86" y="1172" class="node">先执行、再验证、后提交：模型负责选择动作，确定性工具负责数学与状态，Final Gate 负责业务正确性。</text>
  <g transform="translate(1180 1135)"><rect width="155" height="35" rx="18" fill="#e9f2ff"/><text x="78" y="23" text-anchor="middle" class="body">SSE 实时可见</text><rect x="170" width="155" height="35" rx="18" fill="#f0eaff"/><text x="248" y="23" text-anchor="middle" class="body">失败不污染状态</text><rect x="340" width="155" height="35" rx="18" fill="#e5f7f1"/><text x="418" y="23" text-anchor="middle" class="body">指标驱动发布</text></g>
  <text x="1715" y="1218" text-anchor="end" class="small">Current architecture · 2026-08-02</text>
</svg>
