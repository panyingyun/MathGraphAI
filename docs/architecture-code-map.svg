      .step { font-size: 12px; font-weight: 700; fill: #fff; }
      .flow { fill:none; stroke:#3979cf; stroke-width:2.2; marker-end:url(#arrow); }
      .flow-purple { fill:none; stroke:#7a5be2; stroke-width:2.2; marker-end:url(#arrowPurple); }
      .flow-green { fill:none; stroke:#0b9b7b; stroke-width:2.2; marker-end:url(#arrowGreen); }
